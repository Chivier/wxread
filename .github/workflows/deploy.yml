name: wxread

permissions:
  contents: read
  actions: read

# Never interrupt a reading session with another manual/scheduled run.
concurrency:
  group: wxread-reader
  cancel-in-progress: false

on:
  schedule:
    # Beijing 01:07; three sequential sessions, up to six hours total per day.
    - cron: '7 17 * * *'
  workflow_dispatch:
    inputs:
      read_num:
        description: 'Short test: 30-second units; empty runs all three daily sessions'
        required: false
        type: string

jobs:
  session_1:
    uses: ./.github/workflows/read-session.yml
    with:
      session_number: 1
      seconds: 7200
      read_num: ${{ inputs.read_num || '' }}
    secrets: inherit

  session_2:
    needs: session_1
    if: inputs.read_num == ''
    uses: ./.github/workflows/read-session.yml
    with:
      session_number: 2
      seconds: 7200
    secrets: inherit

  session_3:
    needs: session_2
    if: inputs.read_num == ''
    uses: ./.github/workflows/read-session.yml
    with:
      session_number: 3
      seconds: 7200
    secrets: inherit

  keepalive-job:
    name: Keepalive Workflow
    if: always()
    needs: [session_1, session_2, session_3]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
