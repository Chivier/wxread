name: wxread

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 凌晨任务：北京时间每天 01:07（UTC 前一天 17:07），避开 GitHub Actions 整点高峰
    - cron: '7 17 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 午间任务：北京时间每天 11:40（UTC 03:40）
    #- cron: '40 3 * * *'
    # 晚间任务：北京时间每天 22:00（UTC 14:00）
    #- cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Validate Python setup
      run: |
        python -m compileall -q config.py main.py push.py log_utils.py
        python -m pip check
        python -c "import config, requests, urllib3"

    - name: Check login configuration
      id: login
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
      run: |
        if [ -z "$WXREAD_CURL_BASH" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::WXREAD_CURL_BASH is missing; setup verified, reading skipped."
          echo "Setup verified. Reading was skipped because the WXREAD_CURL_BASH repository secret is missing." >> "$GITHUB_STEP_SUMMARY"
        else
          python - <<'PYTHON'
        import config
        if not all(config.cookies.get(key) for key in ("wr_vid", "wr_skey")):
            raise SystemExit("The request must contain wr_vid and wr_skey cookies. Copy it as cURL (bash).")
        PYTHON
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Run deployment script
      if: steps.login.outputs.configured == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
